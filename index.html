<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Location Finder</title>

  <link
    rel="stylesheet"
    href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"
  />

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #f4f7fb;
      color: #1f2937;
    }

    .container {
      width: min(100% - 30px, 900px);
      margin: 30px auto;
    }

    .card {
      background: white;
      padding: 25px;
      border-radius: 18px;
      box-shadow: 0 8px 30px rgba(0, 0, 0, 0.08);
    }

    h1 {
      text-align: center;
      margin-top: 0;
    }

    .subtitle {
      text-align: center;
      color: #6b7280;
      margin-bottom: 25px;
    }

    button {
      display: block;
      width: 100%;
      padding: 14px;
      border: none;
      border-radius: 10px;
      background: #2563eb;
      color: white;
      font-size: 16px;
      font-weight: bold;
      cursor: pointer;
    }

    button:hover {
      background: #1d4ed8;
    }

    .info {
      margin-top: 20px;
      display: grid;
      gap: 12px;
    }

    .info-box {
      padding: 14px;
      background: #f3f4f6;
      border-radius: 10px;
    }

    .label {
      font-weight: bold;
      display: block;
      margin-bottom: 5px;
    }

    #map {
      height: 400px;
      margin-top: 25px;
      border-radius: 14px;
      overflow: hidden;
    }

    .status {
      text-align: center;
      margin-top: 15px;
      color: #6b7280;
    }

    @media (max-width: 600px) {
      .container {
        margin: 15px auto;
      }

      .card {
        padding: 18px;
      }

      #map {
        height: 320px;
      }
    }
  </style>
</head>

<body>

  <div class="container">
    <div class="card">

      <h1>📍 Location Finder</h1>

      <p class="subtitle">
        Find your current location on an interactive map
      </p>

      <button onclick="getLocation()">
        Get My Current Location
      </button>

      <p id="status" class="status">
        Location will only be requested after you press the button.
      </p>

      <div class="info">
        <div class="info-box">
          <span class="label">Latitude</span>
          <span id="latitude">—</span>
        </div>

        <div class="info-box">
          <span class="label">Longitude</span>
          <span id="longitude">—</span>
        </div>

        <div class="info-box">
          <span class="label">Address</span>
          <span id="address">—</span>
        </div>
      </div>

      <div id="map"></div>

    </div>
  </div>

  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>

  <script>
    let map = L.map("map").setView([20, 0], 2);
    let marker = null;

    L.tileLayer(
      "https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png",
      {
        attribution: "&copy; OpenStreetMap contributors"
      }
    ).addTo(map);

    function getLocation() {
      const status = document.getElementById("status");

      if (!navigator.geolocation) {
        status.textContent =
          "Geolocation is not supported by this browser.";
        return;
      }

      status.textContent = "Requesting your location...";

      navigator.geolocation.getCurrentPosition(
        showPosition,
        showError,
        {
          enableHighAccuracy: true,
          timeout: 10000,
          maximumAge: 0
        }
      );
    }

    async function showPosition(position) {
      const latitude = position.coords.latitude;
      const longitude = position.coords.longitude;

      document.getElementById("latitude").textContent =
        latitude.toFixed(6);

      document.getElementById("longitude").textContent =
        longitude.toFixed(6);

      document.getElementById("status").textContent =
        "Location found successfully.";

      map.setView([latitude, longitude], 16);

      if (marker) {
        marker.setLatLng([latitude, longitude]);
      } else {
        marker = L.marker([latitude, longitude]).addTo(map);
      }

      marker.bindPopup("Your current location").openPopup();

      await getAddress(latitude, longitude);
    }

    async function getAddress(latitude, longitude) {
      const addressElement = document.getElementById("address");

      addressElement.textContent = "Finding address...";

      try {
        const response = await fetch(
          `https://nominatim.openstreetmap.org/reverse?format=jsonv2&lat=${latitude}&lon=${longitude}`
        );

        if (!response.ok) {
          throw new Error("Address request failed");
        }

        const data = await response.json();

        addressElement.textContent =
          data.display_name || "Address not found.";
      } catch (error) {
        addressElement.textContent =
          "Unable to find readable address.";
      }
    }

    function showError(error) {
      const status = document.getElementById("status");

      switch (error.code) {
        case error.PERMISSION_DENIED:
          status.textContent =
            "Location permission was denied.";
          break;

        case error.POSITION_UNAVAILABLE:
          status.textContent =
            "Location information is unavailable.";
          break;

        case error.TIMEOUT:
          status.textContent =
            "Location request timed out.";
          break;

        default:
          status.textContent =
            "Unable to get your location.";
      }
    }
  </script>

</body>
</html>
